name: Simulation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: lfenergy/arras:develop
    
    steps:
    - uses: actions/checkout@v4

    - name: Check generation costs
      run: |
        cd generation_modeling
        apt install -y python3.12-venv
        python3.12 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip -r requirements.txt
        python3 validate.py

    - name: Run simulation
      run: |
        cd model
        gridlabd wecc240.glm
      
    - name: Save results
      uses: actions/upload-artifact@v4
      with:
        name: Results
        path: model/
