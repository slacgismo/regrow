name: PyPOWER

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  pypower:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    
    - name: Install packages
      run: |
        cd pypower
        python3 -m pip install --upgrade pip -r requirements.txt pylint

    - name: Analyse code
      run: |
        cd pypower
        pylint --fail-under=9 *.py

    - name: Run tests
      run: |
        cd pypower
        python3 tests.py

    - name: Collect test results
      run: |
        cd pypower
        tar cfz ../pypower-tests.tarz tests

    - name: Save test results
      if: always()
      uses: actions/download-artifact@v5
      with:
        name: pypower-tests
        path: pypower-tests.tarz
